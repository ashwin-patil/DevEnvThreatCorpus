name: Copilot cloud agent setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out trusted repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up governance Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install governance dependency
        run: python -m pip install --requirement requirements-governance.txt
      # Extension point: install only the consuming project's pinned runtime/dependencies here.
      # This setup-job timeout is not a total Copilot cloud-agent session timeout.
      - name: Confirm standard-library governance runtime
        run: python -c "import json, unittest"

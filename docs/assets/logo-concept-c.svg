<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none" role="img" aria-label="DevEnvThreatCorpus Logo Concept C">
  <defs>
    <linearGradient id="tileGradC" x1="10" y1="10" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#23352d"/>
      <stop offset="100%" stop-color="#15211c"/>
    </linearGradient>
    <filter id="glowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Emblem (Graph nodes forming D + telemetry edge lines) -->
  <g transform="translate(6, 6)" filter="url(#glowC)">
    <rect x="10" y="10" width="88" height="88" rx="22" fill="url(#tileGradC)" stroke="#395447" stroke-width="2"/>
    
    <!-- Graph Edges / Attack Paths -->
    <path d="M 36 34 L 36 74" stroke="#486a5b" stroke-width="3" stroke-linecap="round"/>
    <path d="M 36 34 L 70 44 L 70 64 L 36 74" stroke="#cb572d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="36" y1="54" x2="70" y2="44" stroke="#366554" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Graph Nodes -->
    <!-- Node 1: Root / Origin (IDE / Package) -->
    <circle cx="36" cy="34" r="6" fill="#f4f7f2" stroke="#2c5e50" stroke-width="2.5"/>
    <!-- Node 2: Lateral / Abuse (Agent / Tool) -->
    <circle cx="70" cy="44" r="7" fill="#cb572d" stroke="#f4f7f2" stroke-width="2"/>
    <!-- Node 3: Detection / Telemetry (Sink) -->
    <circle cx="70" cy="64" r="6" fill="#ff905f" stroke="#f4f7f2" stroke-width="2"/>
    <!-- Node 4: Base / Foundation -->
    <circle cx="36" cy="74" r="6" fill="#2c5e50" stroke="#f4f7f2" stroke-width="2"/>
  </g>

  <!-- Typography -->
  <text x="124" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="10" font-weight="700" letter-spacing="3" fill="#2c5e50">EVIDENCE → BEHAVIOR → DETECTION</text>

  <text x="124" y="73" font-family="Georgia, serif" font-size="33" font-weight="700" letter-spacing="-0.5" fill="#1b2926">
    DevEnv<tspan font-weight="400" font-style="italic" fill="#cb572d">Threat</tspan><tspan font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="300" fill="#25352f">Corpus</tspan>
  </text>

  <text x="126" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="11.5" font-weight="500" fill="#68746b">Graph-structured attack paths &amp; human-verified claims</text>
</svg>
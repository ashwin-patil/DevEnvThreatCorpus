<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none" role="img" aria-label="DevEnvThreatCorpus Logo Concept B">
  <defs>
    <linearGradient id="shieldGradB" x1="16" y1="12" x2="104" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e2c26"/>
      <stop offset="100%" stop-color="#111c17"/>
    </linearGradient>
    <linearGradient id="orangeGradB" x1="30" y1="30" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0622e"/>
      <stop offset="100%" stop-color="#d94b15"/>
    </linearGradient>
    <filter id="glowB" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Emblem (Hexagonal Dev Shield + Crosshair Reticle) -->
  <g transform="translate(6, 6)" filter="url(#glowB)">
    <!-- Hexagonal Shield Outline -->
    <path d="M 54 12 L 88 28 L 88 68 L 54 94 L 20 68 L 20 28 Z" 
          fill="url(#shieldGradB)" stroke="#395246" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Target Radar Rings -->
    <circle cx="54" cy="53" r="24" stroke="#2c4f42" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
    <circle cx="54" cy="53" r="14" stroke="#366554" stroke-width="1.5" fill="none"/>

    <!-- Radar Crosshairs -->
    <line x1="54" y1="24" x2="54" y2="34" stroke="#cb572d" stroke-width="2" stroke-linecap="round"/>
    <line x1="54" y1="72" x2="54" y2="82" stroke="#cb572d" stroke-width="2" stroke-linecap="round"/>
    <line x1="25" y1="53" x2="35" y2="53" stroke="#cb572d" stroke-width="2" stroke-linecap="round"/>
    <line x1="73" y1="53" x2="83" y2="53" stroke="#cb572d" stroke-width="2" stroke-linecap="round"/>

    <!-- Developer Prompt `>_` at Center -->
    <path d="M 44 45 L 52 53 L 44 61" stroke="#f6f3eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="56" y1="61" x2="65" y2="61" stroke="url(#orangeGradB)" stroke-width="3" stroke-linecap="round"/>

    <!-- Threat alert beacon top right -->
    <circle cx="88" cy="28" r="4" fill="#cb572d"/>
    <circle cx="88" cy="28" r="7" stroke="#cb572d" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Typography -->
  <text x="124" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="10.5" font-weight="700" letter-spacing="2.6" fill="#cb572d">SECURITY BENCHMARK &amp; KNOWLEDGE BASE</text>

  <text x="124" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.8" fill="#1b2926">
    DevEnv<tspan fill="#cb572d">Threat</tspan><tspan font-weight="300" fill="#526359">Corpus</tspan>
  </text>

  <text x="126" y="93" font-family="Consolas, 'Courier New', monospace" 
        font-size="12" font-weight="600" fill="#2c5e50">&gt; corpus.validate() // human_reviewed: true</text>
</svg>